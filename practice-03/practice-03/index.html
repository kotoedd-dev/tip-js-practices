<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практическая работа № 3 — Список задач</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Список задач</h1>
      <p>Практическая работа № 3 — DOM и события</p>
      <a href="./index.html?dataset=variant">Свой вариант</a>
    </header>

    <section id="task-summary" class="summary" aria-label="Статистика задач">
      <div>Всего: <strong data-stat="total">0</strong></div>
      <div>Выполнено: <strong data-stat="completed">0</strong></div>
      <div>Осталось: <strong data-stat="pending">0</strong></div>
      <div>Прогресс: <strong data-stat="progress">0.0%</strong></div>
      <div>Показано: <strong data-stat="visible">0</strong></div>
    </section>

    <section aria-label="Фильтры задач">
      <h2>Фильтр</h2>
      <div id="task-filters" class="filters">
        <button type="button" data-filter="all" aria-pressed="true">Все</button>
        <button type="button" data-filter="pending" aria-pressed="false">В работе</button>
        <button type="button" data-filter="completed" aria-pressed="false">Выполненные</button>
      </div>
    </section>

    <p id="operation-message" role="status" aria-live="polite"></p>
    <p id="empty-message" class="empty-message" hidden></p>
    <ul id="task-list" class="task-list"></ul>
  </main>
</body>
</html>
